[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencrab"
version = "0.1.0"
description = "MCP server plugin exposing MetaOntology OS grammar to OpenClaw-type agent environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "OpenCrab Contributors" }
]
keywords = ["mcp", "ontology", "graph", "agent", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "neo4j>=5.0",
    "chromadb>=0.5",
    "sqlite-vec>=0.1.9",
    # numpy: sqlite-vec binary 2단계 양자화(VECTOR_ANN=binary)의 sign-bit 패킹/
    # hamming coarse(np.bitwise_count는 numpy 2.0+)/int8 rerank. chromadb 전이
    # 의존성이지만 opencrab가 직접 import 하므로 명시.
    "numpy>=2.0",
    "pymongo>=4.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "httpx>=0.27",
]

# Runtime SQLite version note:
#   LocalGraphStore (STORAGE_MODE=local) uses json_extract() which requires
#   SQLite >= 3.9.0 (2015-10-14). Python's bundled sqlite3 module version can
#   be checked with: python3 -c "import sqlite3; print(sqlite3.sqlite_version)"
#   Raspberry Pi OS Bookworm ships SQLite 3.39.2 — well above the minimum.
#   Python packages cannot express a sqlite3 version constraint directly;
#   this note serves as the authoritative record of the requirement.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.4",
    "mypy>=1.10",
]
# EMBEDDING_BACKEND=openai 의 로컬 GGUF 폴백(LlamaCppEmbeddingFunction)에 필요.
# 기본 dependencies 에는 넣지 않음 — OpenAI 호환 서버가 항상 떠 있는 환경에서는
# 불필요한 빌드 의존성(llama-cpp-python은 네이티브 빌드)이기 때문.
gguf = [
    "llama-cpp-python>=0.3",
]
# STORAGE_MODE=kuzu (KuzuGraphStore) 에 필요. ladybug는 KùzuDB의 리브랜딩
# (https://github.com/LadybugDB/ladybug); 0.18 이상은 16KB 페이지 커널
# (RPi5 등)에서의 madvise 크래시(LadybugDB/ladybug#526/#527)가 수정돼 있다.
kuzu = [
    "ladybug>=0.18",
]
# STORAGE_MODE=pg (PGGraphStore/PgDocStore/PgVectorStore, 4스토어 PostgreSQL
# 통합) 에 필요. sqlalchemy/psycopg2-binary 는 이미 기본 dependencies 에 있음
# (SQLStore 의 기존 PG 지원 경로) — pgvector 는 Postgres 확장(CREATE EXTENSION
# vector)의 파이썬 타입 어댑터 패키지로, PG-unified 배포에서만 필요.
pg = [
    "pgvector>=0.4",
]

[project.scripts]
opencrab = "opencrab.cli:main"

[project.urls]
Homepage = "https://github.com/opencrab/opencrab"
Repository = "https://github.com/opencrab/opencrab"
Issues = "https://github.com/opencrab/opencrab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencrab*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Imports after load_dotenv()/sys.path.insert() — intentional load-order dependency.
"apps/api/main.py" = ["E402"]
"scripts/bench_graph_backends.py" = ["E402"]
# Math/QA-notation matrix-style variable names (N, M, C, K) — deliberate, not identifiers to rename.
"tests/test_store_concurrency.py" = ["N806"]
# pytest fixture re-export (`live` imported from tests/test_pack_load, then injected as a
# test parameter) — F811 is a false positive for this standard pytest pattern.
"tests/test_pack_load_r11_pg_gates.py" = ["F811"]
"tests/test_pack_load_r12_selfheal_gates.py" = ["F811"]
"tests/test_pack_load_r13_owner_pred_gates.py" = ["F811"]
"tests/test_vector_store_parity.py" = ["N806"]
"scripts/qa/bench_vector_backend.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["opencrab"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
