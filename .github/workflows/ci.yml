# 커버리지 게이트는 pyproject.toml [tool.coverage.report] fail_under 에 위임한다
# (Stage 9에서 래칫 오버라이드 제거 완료, 현재 85%). pytest --cov 실행 시 리포트
# 단계에서 이 값이 자동 발효되므로 CLI --cov-fail-under 은 두지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opencrab
          POSTGRES_PASSWORD: opencrab
          POSTGRES_DB: opencrab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencrab -d opencrab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,pg]"

      - name: Install ladybug (best-effort, kuzu tests skip if unavailable)
        run: pip install "ladybug>=0.18" || echo "ladybug unavailable — kuzu tests will skip"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        env:
          OPENCRAB_PG_TEST_URL: postgresql://opencrab:opencrab@localhost:5432/opencrab_test
        run: pytest -q --cov=opencrab -o addopts=''
